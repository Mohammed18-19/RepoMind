services:
  db:
    image: pgvector/pgvector:pg17
    container_name: repomind-db
    environment:
      POSTGRES_DB: repomind_db
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: repomind-app
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  postgres_data: